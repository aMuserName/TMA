<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Messaging</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }
        #messageInput {
            width: 80%;
            padding: 10px;
        }
        #sendButton {
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <h1>Real-Time Messaging</h1>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Type your message here..." />
    <button id="sendButton">Send</button>

    <script>
        // Initialize Telegram Web App
        //const tg = window.Telegram.WebApp;

        // Expand the web app to full screen
        //tg.expand();
        
        const ticketId = 12345567//tg.initDataUnsafe.ticket_id;
        console.log("Incoming ticket:", ticketId);

        const messagesDiv = document.getElementById("messages");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");

        // Fetch previous messages when the app loads
        async function fetchPreviousMessages() {
            const response = await fetch(`http://147.45.253.53:18900/messages/${ticketId}`);
            const data = await response.json();
            data.messages.forEach(message => {
                const messageElement = document.createElement("div");
                messageElement.textContent = `User ${message.user_id}: ${message.text}`;
                messagesDiv.appendChild(messageElement);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto-scroll
        }

        // Connect to WebSocket
        const ws = new WebSocket("ws://147.45.253.53:18900/ws");

        // Handle incoming messages
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "message") {
                const message = data.data;
                const messageElement = document.createElement("div");
                messageElement.textContent = `User ${message.user.id}: ${message.text}`;
                messagesDiv.appendChild(messageElement);
                messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto-scroll
            }
        };

        // Send message
        sendButton.onclick = () => {
            const message = messageInput.value;
            if (message) {
                ws.send(JSON.stringify({ text: message, user: "test_user", ticket_id: ticketId})); //tg.initDataUnsafe.user
                messageInput.value = ""; // Clear input
            }
        };

        // Send message on Enter key
        messageInput.onkeypress = (event) => {
            if (event.key === "Enter") {
                sendButton.click();
            }
        };

        // Fetch previous messages when the app loads
        fetchPreviousMessages();
    </script>
</body>
</html>
